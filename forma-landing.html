<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>FORMA | Audio Solutions</title>
  <meta name="description" content="FORMA Audio Solutions. Sound design, sonic identity and music production.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260831">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..500;1,6..72,200..500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #000000;
      --porcelain: #ffffff;
      --sand: #e4dcd4;
      --bone: #e8e5de;
      --atm-1: #aab5c4;
      --atm-2: #cdcFcc;
      --atm-3: #e8e5de;
      --atm-4: #eae4d9;
      --atm-5: #bdb4a8;
      --atm-6: #857c70;
      --cobalt-2: #8e9dbe;
      --cobalt-1: #c9d2e0;
      --cobalt-3: #6e83ae;
      --cobalt-4: #3f5e9e;
      --cobalt-5: #233a66;
      --cobalt-6: #1f3258;
      --cobalt-ink: #16264a;
      --cobalt-fg: #eaeff8;
      --cobalt-line: rgba(173, 190, 224, .28);
      --cobalt-accent: #a9bee6;
      --form-ink: #000000;
      --form-fg: #ffffff;
      --form-line: rgba(0, 0, 0, .2);
      --field-veil: linear-gradient(180deg, #aeb8c6 0%, #cfd0cd 18%, #e8e5de 42%, #e4dcd4 80%, #d7cfc5 100%);
      --bridge-dusk: linear-gradient(180deg, #ffffff 0%, #d9dbde 24%, #8e9dbe 54%, #3f5e9e 80%, #1f3258 100%);
      --font-serif: "Newsreader", "Times New Roman", serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --ease: cubic-bezier(.4, 0, .2, 1);
      --scene-progress: 0;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: var(--porcelain);
    }

    body {
      position: relative;
      min-height: 100dvh;
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }

    .global-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: var(--porcelain);
      pointer-events: auto;
    }

    .scene-day,
    .scene-night {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .scene-day {
      background:
        radial-gradient(64% 78% at -4% -8%, rgba(170, 181, 196, .62) 0%, rgba(205, 207, 204, .22) 43%, rgba(255, 255, 255, 0) 72%),
        radial-gradient(60% 72% at 104% 108%, rgba(228, 220, 212, .72) 0%, rgba(234, 228, 217, .22) 46%, rgba(255, 255, 255, 0) 74%),
        var(--porcelain);
      opacity: calc(1 - var(--scene-progress));
    }

    .scene-night {
      background:
        radial-gradient(92% 48% at 22% 4%, rgba(226, 232, 243, .78), rgba(226, 232, 243, 0) 72%),
        linear-gradient(180deg, #c9d2e0 0%, #8e9dbe 40%, #3f5e9e 72%, #1f3258 100%);
      opacity: var(--scene-progress);
    }

    .hero {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      isolation: isolate;
      overflow: hidden;
      pointer-events: none;
    }

    .atmosphere {
      position: absolute;
      inset: -10%;
      z-index: 0;
      pointer-events: none;
      background: var(--field-veil);
      background-size: 120% 130%;
      background-position: 0% 50%;
      opacity: .24;
      animation: forma-drift 16s var(--ease) infinite alternate;
    }

    .atmosphere::before {
      position: absolute;
      top: -14%;
      left: 36%;
      width: 110px;
      height: 130%;
      content: "";
      transform: translateX(-50%) rotate(5deg);
      background: linear-gradient(180deg, rgba(255, 255, 253, 0), rgba(255, 255, 253, .5) 48%, rgba(255, 255, 253, 0));
      filter: blur(6px);
      animation: forma-float 9s var(--ease) infinite alternate;
    }

    .atmosphere::after {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 62%;
      content: "";
      background: radial-gradient(72% 92% at 50% 6%, rgba(252, 252, 250, .85), rgba(252, 252, 250, 0) 72%);
    }

    #sound-field {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      outline: 0;
      touch-action: pan-y;
    }

    .brand-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 2;
      width: min(68vw, 980px);
      aspect-ratio: 3045.2 / 1010.9;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
    }

    .wordmark-slice {
      position: absolute;
      left: 0;
      z-index: 1;
      display: block;
      overflow: hidden;
    }

    .wordmark-slice img {
      position: absolute;
      left: 0;
      display: block;
      max-width: none;
      height: auto;
    }

    .wordmark-for {
      top: 0;
      width: 53.4%;
      height: 76%;
    }

    .wordmark-for img {
      top: 0;
      width: 187.266%;
      -webkit-mask-image: radial-gradient(ellipse 10.9% 31.5% at 27.835% 41.03%, transparent 0 97%, #000 100%);
      mask-image: radial-gradient(ellipse 10.9% 31.5% at 27.835% 41.03%, transparent 0 97%, #000 100%);
    }

    .wordmark-tag {
      top: 76%;
      width: 100%;
      height: 24%;
    }

    .wordmark-tag img {
      top: -316.667%;
      width: 100%;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .ma-shell {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: block;
      overflow: visible;
      isolation: isolate;
    }

    .ma-layer {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      clip-path: polygon(53.1% 0, 100% 0, 100% 76%, 53.1% 76%);
      pointer-events: none;
      will-change: opacity, -webkit-mask-position, mask-position;
    }

    .ma-base {
      opacity: .9;
      filter: drop-shadow(0 6px 14px rgba(22, 38, 74, .08));
      mix-blend-mode: multiply;
    }

    .ma-glass {
      opacity: .14;
      filter: invert(1) brightness(1.12);
      mix-blend-mode: screen;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    .ma-highlight {
      opacity: .2;
      filter: invert(1) brightness(1.18) drop-shadow(0 0 10px rgba(255, 255, 255, .5));
      mix-blend-mode: screen;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    .letter-fx,
    .tag-fx {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: block;
      overflow: hidden;
      pointer-events: none;
    }

    .letter-fx-f {
      clip-path: polygon(0 0, 16.4% 0, 16.4% 76%, 0 76%);
    }

    .letter-fx-r {
      clip-path: polygon(34% 0, 53.4% 0, 53.4% 76%, 34% 76%);
    }

    .tag-fx {
      clip-path: polygon(0 76%, 100% 76%, 100% 100%, 0 100%);
    }

    .wordmark-fx {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      will-change: opacity, -webkit-mask-image, mask-image;
    }

    .for-glass {
      opacity: .09;
      filter: invert(1) brightness(1.1);
      mix-blend-mode: screen;
    }

    .for-highlight {
      opacity: .18;
      filter: invert(1) brightness(1.16) drop-shadow(0 0 8px rgba(255, 255, 255, .42));
      mix-blend-mode: screen;
    }

    .tag-glass {
      opacity: .22;
      filter: invert(1) brightness(1.12) drop-shadow(0 0 12px rgba(255, 255, 255, .5));
      mix-blend-mode: screen;
    }

    .tag-highlight {
      opacity: .44;
      filter: invert(1) brightness(1.22) drop-shadow(0 0 10px rgba(255, 255, 255, .7));
      mix-blend-mode: screen;
    }

    .spectrum-mark {
      position: absolute;
      z-index: 3;
      display: block;
      overflow: visible;
      fill: var(--ink);
      pointer-events: none;
      will-change: transform;
    }

    .spectrum-mark rect {
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform, opacity;
    }

    .nightfall {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      isolation: isolate;
      overflow: hidden;
      color: var(--cobalt-fg);
      pointer-events: none;
    }

    .contact-launch {
      position: absolute;
      bottom: clamp(72px, 10vh, 116px);
      left: clamp(28px, 6vw, 96px);
      z-index: 3;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      width: min(320px, calc(100vw - 56px));
      min-height: 68px;
      padding: 0 24px;
      border: 1px solid rgba(234, 239, 248, .48);
      border-radius: 999px;
      background: rgba(234, 239, 248, .08);
      color: var(--cobalt-fg);
      font: 500 12px/1 var(--font-mono);
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: background .24s var(--ease), border-color .24s var(--ease), transform .18s var(--ease);
    }

    .contact-launch::after {
      width: 9px;
      height: 9px;
      content: "";
      border-top: 1px solid currentColor;
      border-right: 1px solid currentColor;
      transform: rotate(45deg);
    }

    .contact-launch:hover {
      border-color: rgba(234, 239, 248, .9);
      background: rgba(234, 239, 248, .15);
    }

    .contact-launch:active {
      transform: scale(.985);
    }

    .contact-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      justify-content: flex-end;
      background: rgba(0, 0, 0, .62);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity .24s var(--ease), visibility 0s linear .24s;
    }

    .contact-modal.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition-delay: 0s;
    }

    .contact-panel {
      width: min(680px, 100%);
      height: 100%;
      padding: clamp(28px, 5vw, 64px);
      overflow-y: auto;
      color: var(--form-ink);
      background: rgba(249, 249, 247, .97);
      transform: translateX(4%);
      transition: transform .26s var(--ease);
    }

    .contact-modal.open .contact-panel {
      transform: translateX(0);
    }

    .contact-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: clamp(40px, 7vh, 72px);
    }

    .contact-kicker,
    .contact-close,
    .contact-form label,
    .contact-note {
      font-family: var(--font-mono);
    }

    .contact-kicker {
      margin: 0 0 12px;
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .56;
    }

    .contact-title {
      max-width: 480px;
      margin: 0;
      font: 300 clamp(44px, 7vw, 76px)/.96 var(--font-serif);
      letter-spacing: -.04em;
    }

    .contact-close {
      display: grid;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      place-items: center;
      padding: 0;
      border: 1px solid var(--form-line);
      border-radius: 50%;
      color: inherit;
      background: transparent;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      transition: background .2s ease, transform .18s ease;
    }

    .contact-close:hover {
      background: rgba(0, 0, 0, .06);
    }

    .contact-close:active {
      transform: scale(.96);
    }

    .contact-form {
      display: grid;
      gap: 24px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .contact-field {
      display: grid;
      gap: 8px;
    }

    .contact-form label {
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: .62;
    }

    .contact-form input,
    .contact-form select,
    .contact-form textarea {
      width: 100%;
      min-height: 50px;
      padding: 12px 0;
      border: 0;
      border-bottom: 1px solid var(--form-line);
      border-radius: 0;
      outline: 0;
      color: var(--form-ink);
      background: transparent;
      font: 400 15px/1.4 var(--font-mono);
      transition: border-color .2s ease;
    }

    .contact-form textarea {
      min-height: 100px;
      resize: vertical;
    }

    .contact-form input:focus,
    .contact-form select:focus,
    .contact-form textarea:focus {
      border-color: var(--form-ink);
    }

    .contact-submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      margin-top: 8px;
      border: 0;
      border-radius: 999px;
      color: var(--form-fg);
      background: var(--form-ink);
      font: 500 11px/1 var(--font-mono);
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity .2s ease, transform .18s ease;
    }

    .contact-submit:hover {
      opacity: .86;
    }

    .contact-submit:active {
      transform: scale(.99);
    }

    .contact-note {
      min-height: 18px;
      margin: 0;
      font-size: 11px;
      line-height: 1.5;
      opacity: .66;
    }

    body.modal-open {
      overflow: hidden;
    }

    @keyframes forma-drift { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
    @keyframes forma-float { from { transform: translateY(2%); } to { transform: translateY(-2%); } }
    @media (max-width: 700px) {
      .atmosphere {
        inset: -8%;
        opacity: .2;
      }

      .brand-stage {
        top: 49%;
        width: calc(100vw - 36px);
      }

      .contact-launch {
        right: 24px;
        bottom: 56px;
        left: 24px;
        width: auto;
      }

      .contact-panel {
        padding: 28px 20px 40px;
      }

      .contact-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>
<body>
  <div class="global-scene" aria-hidden="true">
    <div class="scene-day">
      <div class="atmosphere"></div>
    </div>
    <div class="scene-night"></div>
    <canvas id="sound-field"></canvas>
  </div>

  <main class="hero" aria-label="FORMA">
    <h1 class="brand-stage">
      <span class="sr-only">FORMA Audio Solutions</span>
      <span class="wordmark-slice wordmark-for" aria-hidden="true">
        <img class="wordmark-source" data-forma-wordmark alt="">
      </span>
      <span class="wordmark-slice wordmark-tag" aria-hidden="true">
        <img class="wordmark-source" data-forma-wordmark alt="">
      </span>
      <span class="ma-shell" aria-hidden="true">
        <img class="ma-layer ma-base" data-forma-wordmark alt="">
        <img class="ma-layer ma-glass" data-forma-wordmark alt="">
        <img class="ma-layer ma-highlight" data-forma-wordmark alt="">
      </span>
      <span class="letter-fx letter-fx-f" aria-hidden="true">
        <img class="wordmark-fx for-glass" data-forma-wordmark alt="">
        <img class="wordmark-fx for-highlight" data-forma-wordmark alt="">
      </span>
      <span class="letter-fx letter-fx-r" aria-hidden="true">
        <img class="wordmark-fx for-glass" data-forma-wordmark alt="">
        <img class="wordmark-fx for-highlight" data-forma-wordmark alt="">
      </span>
      <span class="tag-fx" aria-hidden="true">
        <img class="wordmark-fx tag-glass" data-forma-wordmark alt="">
        <img class="wordmark-fx tag-highlight" data-forma-wordmark alt="">
      </span>
    </h1>
    <svg class="spectrum-mark" viewBox="0 0 231 226" preserveAspectRatio="none" aria-hidden="true">
      <rect x="0" y="102" width="7" height="22"></rect>
      <rect x="13" y="76" width="7" height="74"></rect>
      <rect x="25" y="52" width="7" height="121"></rect>
      <rect x="37" y="32" width="7" height="161"></rect>
      <rect x="50" y="17" width="7" height="192"></rect>
      <rect x="62" y="7" width="7" height="212"></rect>
      <rect x="75" y="1" width="7" height="224"></rect>
      <rect x="87" y="0" width="7" height="226"></rect>
      <rect x="100" y="3" width="7" height="220"></rect>
      <rect x="112" y="9" width="7" height="208"></rect>
      <rect x="124" y="18" width="7" height="190"></rect>
      <rect x="137" y="29" width="7" height="167"></rect>
      <rect x="149" y="42" width="7" height="142"></rect>
      <rect x="162" y="56" width="7" height="114"></rect>
      <rect x="174" y="70" width="7" height="86"></rect>
      <rect x="187" y="83" width="7" height="60"></rect>
      <rect x="199" y="95" width="7" height="36"></rect>
      <rect x="211" y="105" width="7" height="16"></rect>
      <rect x="224" y="108" width="7" height="9"></rect>
    </svg>
  </main>

  <section class="nightfall" aria-label="Contact FORMA">
    <button class="contact-launch" id="contact-launch" type="button">Start a project</button>
  </section>

  <div class="contact-modal" id="contact-modal" aria-hidden="true">
    <section class="contact-panel" role="dialog" aria-modal="true" aria-labelledby="contact-title">
      <header class="contact-head">
        <div>
          <p class="contact-kicker">New project</p>
          <h2 class="contact-title" id="contact-title">Build a sonic world with us.</h2>
        </div>
        <button class="contact-close" id="contact-close" type="button" aria-label="Close contact form">×</button>
      </header>

      <form class="contact-form" id="contact-form">
        <div class="contact-grid">
          <div class="contact-field">
            <label for="contact-name">Your name</label>
            <input id="contact-name" type="text" name="name" placeholder="Name" autocomplete="name" required>
          </div>
          <div class="contact-field">
            <label for="contact-company">Company</label>
            <input id="contact-company" type="text" name="company" placeholder="Company name" autocomplete="organization">
          </div>
        </div>

        <div class="contact-field">
          <label for="contact-email">Work email</label>
          <input id="contact-email" type="email" name="email" placeholder="you@company.com" autocomplete="email" required>
        </div>

        <div class="contact-field">
          <label for="contact-service">What do you need?</label>
          <select id="contact-service" name="service">
            <option value="">Select a service</option>
            <option value="sound-design">Sound Design for Film / Campaign</option>
            <option value="sonic-branding">Sonic Branding / Audio Identity</option>
            <option value="music-production">Music Production / Composition</option>
            <option value="spatial-audio">Spatial Audio / Immersive</option>
            <option value="sonic-strategy">Sonic Strategy / Consulting</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="contact-field">
          <label for="contact-brief">Project brief</label>
          <textarea id="contact-brief" name="brief" placeholder="Project, timeline, scope, references..."></textarea>
        </div>

        <div class="contact-grid">
          <div class="contact-field">
            <label for="contact-budget">Budget range</label>
            <select id="contact-budget" name="budget">
              <option value="">Prefer not to say</option>
              <option value="&lt;5k">Under $5,000</option>
              <option value="5-15k">$5,000 to $15,000</option>
              <option value="15-50k">$15,000 to $50,000</option>
              <option value="50k+">$50,000+</option>
            </select>
          </div>
          <div class="contact-field">
            <label for="contact-timeline">Timeline</label>
            <select id="contact-timeline" name="timeline">
              <option value="">No rush</option>
              <option value="asap">ASAP</option>
              <option value="1-2w">1 to 2 weeks</option>
              <option value="1m">About 1 month</option>
              <option value="3m+">3+ months</option>
            </select>
          </div>
        </div>

        <button class="contact-submit" type="submit">Send inquiry</button>
        <p class="contact-note" id="contact-note" aria-live="polite"></p>
      </form>

  <script>
    const formaWordmarkData = document.querySelector('#forma-wordmark-data').textContent.trim();
    const formaWordmarkSrc = `data:image/svg+xml;base64,${formaWordmarkData}`;
    document.querySelectorAll('[data-forma-wordmark]').forEach(image => {
      image.src = formaWordmarkSrc;
    });

    (() => {
      const canvas = document.querySelector('#sound-field');
      const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
      const brandStage = document.querySelector('.brand-stage');
      const spectrumMark = document.querySelector('.spectrum-mark');
      const maShell = document.querySelector('.ma-shell');
      const maGlass = document.querySelector('.ma-glass');
      const maHighlight = document.querySelector('.ma-highlight');
      const forGlasses = [...document.querySelectorAll('.for-glass')];
      const forHighlights = [...document.querySelectorAll('.for-highlight')];
      const tagGlass = document.querySelector('.tag-glass');
      const tagHighlight = document.querySelector('.tag-highlight');
      const bars = [...spectrumMark.querySelectorAll('rect')];
      const contactLaunch = document.querySelector('#contact-launch');
      const contactModal = document.querySelector('#contact-modal');
      const contactClose = document.querySelector('#contact-close');
      const contactForm = document.querySelector('#contact-form');
      const contactNote = document.querySelector('#contact-note');
      const tau = Math.PI * 2;
      const dayInk = [0, 0, 0];
      const nightInk = [190, 205, 232];

      let width = 0;
      let height = 0;
      let dpr = 1;
      let elapsed = 0;
      let lastFrame = performance.now();
      let envelope = .5;
      let pulseEnergy = 0;
      let activeModeState = null;
      let sceneProgress = 0;
      let contactReturnFocus = null;

      const formUrl = 'https://script.google.com/macros/s/AKfycbyL59q0C-Zzu1Vougkb3HAC6OLkj0FBN9gGE-AxxhIvNfqPphWuj6aTWDOqsVDqaRZa/exec';

      const source = { x: 0, y: 0, radius: 240, markSize: 160 };
      const globe = { rx: -.46, ry: .58, rz: .12 };
      const spectrumLevels = Array.from({ length: bars.length }, () => .72);
      const waveformModes = [
        { type: 'sine', cycles: 2.25, speed: 1.28, amplitude: .105 },
        { type: 'square', cycles: 1.5, speed: .92, amplitude: .082 },
        { type: 'saw', cycles: 2.1, speed: 1.06, amplitude: .094 },
        { type: 'triangle', cycles: 1.8, speed: 1.12, amplitude: .1 }
      ];
      const modeDuration = 20;
      const modeTransition = 2.4;
      const pointer = {
        x: 0,
        y: 0,
        targetX: 0,
        targetY: 0,
        active: false,
        dragging: false,
        hold: 0,
        holdTarget: 0,
        orbitX: 0,
        orbitY: 0,
        velocityX: 0,
        velocityY: 0,
        wheel: 0,
        wheelTarget: 0,
        pointerId: null,
        lastX: 0,
        lastY: 0
      };

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, amount) {
        return a + (b - a) * amount;
      }

      function easeOutCubic(value) {
        return 1 - Math.pow(1 - value, 3);
      }

      function rgba(color, alpha) {
        return `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;
      }

      function openContact() {
        contactReturnFocus = document.activeElement;
        contactModal.classList.add('open');
        contactModal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('modal-open');
        requestAnimationFrame(() => contactForm.elements.name.focus());
      }

      function closeContact() {
        contactModal.classList.remove('open');
        contactModal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('modal-open');
        contactReturnFocus?.focus?.();
      }

      function submitContact(event) {
        event.preventDefault();
        const form = event.currentTarget;
        const submit = form.querySelector('.contact-submit');
        const payload = {
          type: 'inquiry',
          name: form.elements.name.value,
          company: form.elements.company.value,
          email: form.elements.email.value,
          service: form.elements.service.value,
          budget: form.elements.budget.value,
          timeline: form.elements.timeline.value,
          brief: form.elements.brief.value,
          timestamp: new Date().toISOString()
        };

        submit.disabled = true;
        contactNote.textContent = 'Sending...';

        fetch(formUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(() => {
            contactNote.textContent = 'Sent. We will get back within 48h.';
            form.reset();
          })
          .catch(() => {
            contactNote.textContent = 'Failed to send. Please try again.';
          })
          .finally(() => {
            submit.disabled = false;
          });
      }

      function mixColor(from, to, amount) {
        return from.map((value, index) => Math.round(lerp(value, to[index], amount)));
      }

      function rotatePoint(point, rx, ry, rz) {
        let { x, y, z } = point;

        const cx = Math.cos(rx);
        const sx = Math.sin(rx);
        const y1 = y * cx - z * sx;
        const z1 = y * sx + z * cx;
        y = y1;
        z = z1;

        const cy = Math.cos(ry);
        const sy = Math.sin(ry);
        const x2 = x * cy + z * sy;
        const z2 = -x * sy + z * cy;
        x = x2;
        z = z2;

        const cz = Math.cos(rz);
        const sz = Math.sin(rz);
        return {
          x: x * cz - y * sz,
          y: x * sz + y * cz,
          z
        };
      }

      function updateSource() {
        const rect = brandStage.getBoundingClientRect();
        const pageScroll = document.documentElement.scrollTop || 0;
        const markSize = clamp(rect.width * .205, 64, 202);

        source.x = rect.left + rect.width * .27835;
        source.y = rect.top + pageScroll + rect.height * .4103;
        source.radius = clamp(rect.width * .34, 240, 560);
        source.markSize = markSize;
        spectrumMark.style.left = `${source.x}px`;
        spectrumMark.style.top = `${source.y}px`;
        spectrumMark.style.width = `${markSize}px`;
        spectrumMark.style.height = `${markSize * 226 / 231}px`;
        spectrumMark.style.transform = 'translate(-50%, -50%)';
      }

      function viewFor() {
        const compact = width < 700;
        const driftX = Math.sin(elapsed * .38) * width * lerp(.044, .074, sceneProgress);
        const driftY = Math.cos(elapsed * .31) * height * lerp(.052, .082, sceneProgress);
        const breath = 1 + Math.sin(elapsed * tau / 6.8) * .085 + (envelope - .7) * .11 + pulseEnergy * .065;
        const interactionZoom = clamp(1 + pointer.hold * .13 + pointer.wheel * .24, .76, 1.32);
        const dayCx = lerp(width * .5, source.x, .84);
        const dayCy = lerp(height * (compact ? .49 : .5), source.y, .78);
        const nightCx = width * (compact ? .5 : .52);
        const nightCy = height * (compact ? .48 : .49);
        const scrollZoom = lerp(1, compact ? 1.08 : 1.12, sceneProgress);

        return {
          cx: lerp(dayCx, nightCx, sceneProgress) + driftX,
          cy: lerp(dayCy, nightCy, sceneProgress) + driftY,
          scale: Math.max(width, height) * (compact ? .39 : .35) * breath * interactionZoom * scrollZoom,
          rx: globe.rx + pointer.orbitX + pointer.y * .08 + sceneProgress * .28,
          ry: globe.ry + pointer.orbitY + pointer.x * .1 + sceneProgress * .44,
          rz: globe.rz + pointer.x * .025 + sceneProgress * .08,
          camera: lerp(7.8, 7.35, sceneProgress) + Math.sin(elapsed * .28) * .7 - pointer.hold * .55 - Math.abs(pointer.wheel) * .42
        };
      }

      function project(point, view) {
        const rotated = rotatePoint(point, view.rx, view.ry, view.rz);
        const perspective = view.camera / Math.max(2.8, view.camera - rotated.z);
        let x = view.cx + rotated.x * view.scale * perspective;
        let y = view.cy - rotated.y * view.scale * perspective;

        return { x, y, z: rotated.z };
      }

      function spherePoint(theta, phi) {
        const mode = activeModeState || waveformModeState();
        const signal = spectrumSignal(phi);
        const poleEnvelope = Math.pow(Math.max(0, Math.sin(theta)), .72);
        const frequencyShift = clamp(1 + pointer.wheel * .24, .78, 1.28);
        const currentPhase = theta / Math.PI * mode.current.cycles * frequencyShift * tau + phi - elapsed * mode.current.speed;
        const nextPhase = theta / Math.PI * mode.next.cycles * frequencyShift * tau + phi - elapsed * mode.next.speed;
        const currentWave = waveformValue(mode.current.type, currentPhase);
        const nextWave = waveformValue(mode.next.type, nextPhase);
        const wave = lerp(currentWave, nextWave, mode.blend);
        const modeAmplitude = lerp(mode.current.amplitude, mode.next.amplitude, mode.blend);
        const signalAmplitude = .42 + signal * .68 + pulseEnergy * .18 + pointer.hold * .12;
        const radius = 2.62 * (1 + wave * modeAmplitude * signalAmplitude * poleEnvelope);
        return {
          x: radius * Math.sin(theta) * Math.cos(phi),
          y: radius * Math.cos(theta),
          z: radius * Math.sin(theta) * Math.sin(phi)
        };
      }

      function drawDepthLine(points, view, opacity, baseWidth) {
        const bins = [new Path2D(), new Path2D(), new Path2D(), new Path2D()];
        const lineColor = mixColor(dayInk, nightInk, sceneProgress);
        let previous = project(points[0], view);

        for (let index = 1; index < points.length; index += 1) {
          const current = project(points[index], view);
          const depth = clamp(((previous.z + current.z) * .5 + 4.4) / 8.8, 0, .999);
          const bin = Math.floor(depth * bins.length);
          bins[bin].moveTo(previous.x, previous.y);
          bins[bin].lineTo(current.x, current.y);
          previous = current;
        }

        bins.forEach((path, index) => {
          const depth = (index + .5) / bins.length;
          const depthPulse = .7 + Math.sin(elapsed * .72 + depth * 4.8) * .3;
          const alpha = opacity * lerp(.42, 1, depth) * depthPulse * lerp(1, 1.28, sceneProgress);
          ctx.strokeStyle = rgba(lineColor, alpha);
          ctx.lineWidth = baseWidth * lerp(.62, 1.28, depth) * (1 + envelope * .16 + pulseEnergy * .24) * lerp(1, 1.22, sceneProgress);
          ctx.stroke(path);
        });
      }

      function waveformValue(type, phase) {
        if (type === 'square') return Math.tanh(Math.sin(phase) * 9);
        if (type === 'saw') {
          const turn = phase / tau;
          return 2 * (turn - Math.floor(turn + .5));
        }
        if (type === 'triangle') return 2 / Math.PI * Math.asin(Math.sin(phase));
        return Math.sin(phase);
      }

      function spectrumSignal(phi) {
        const normalized = ((phi % tau) + tau) % tau / tau;
        const position = normalized * spectrumLevels.length;
        const left = Math.floor(position) % spectrumLevels.length;
        const right = (left + 1) % spectrumLevels.length;
        const level = lerp(spectrumLevels[left], spectrumLevels[right], position - Math.floor(position));
        return clamp((level - .22) / 1.34, 0, 1);
      }

      function waveformModeState() {
        const cycleDuration = modeDuration * waveformModes.length;
        const cycleTime = ((elapsed % cycleDuration) + cycleDuration) % cycleDuration;
        const index = Math.floor(cycleTime / modeDuration);
        const timeInMode = cycleTime - index * modeDuration;
        const transitionProgress = clamp((timeInMode - (modeDuration - modeTransition)) / modeTransition, 0, 1);
        const blend = transitionProgress * transitionProgress * (3 - 2 * transitionProgress);
        const current = waveformModes[index];
        const next = waveformModes[(index + 1) % waveformModes.length];

        document.body.dataset.waveform = current.type;
        document.body.dataset.nextWaveform = next.type;
        document.body.dataset.waveformBlend = blend.toFixed(3);

        return { current, next, blend };
      }

      function renderGlobe() {
        const view = viewFor();
        const meridians = spectrumLevels.length;
        const parallels = spectrumLevels.length;

        for (let line = 0; line < meridians; line += 1) {
          const phi = tau * line / meridians;
          const signal = spectrumSignal(phi);
          const points = [];
          for (let sample = 0; sample <= 160; sample += 1) {
            points.push(spherePoint(Math.PI * sample / 160, phi));
          }
          drawDepthLine(points, view, .2 + signal * .3, .52 + signal * .34);
        }

        for (let line = 1; line < parallels; line += 1) {
          const theta = Math.PI * line / parallels;
          const points = [];
          for (let sample = 0; sample <= 180; sample += 1) {
            points.push(spherePoint(theta, tau * sample / 180));
          }
          drawDepthLine(points, view, .17 + envelope * .075, .54);
        }
      }

      function updateSpectrum() {
        const pulseCycle = elapsed % 7.2;
        let strongestPulse = 0;

        bars.forEach((bar, index) => {
          const distance = Math.abs(index - 9);
          const travelingWave = .5 + .5 * Math.sin(elapsed * 4.15 - distance * .72);
          const secondaryWave = .5 + .5 * Math.sin(elapsed * 2.05 + index * .44);
          const wave = .44 + travelingWave * .5 + secondaryWave * .14;
          const grow = easeOutCubic(clamp((elapsed - distance * .045) / .5, 0, 1));
          const pulseProgress = clamp((pulseCycle - (5.35 + distance * .05)) / .58, 0, 1);
          const shock = Math.sin(pulseProgress * Math.PI) * .55;
          const interaction = pointer.hold * .22 + Math.abs(pointer.wheel) * .13;
          const scale = clamp(wave * (1 + shock + interaction) * grow, .22, 1.56);

          strongestPulse = Math.max(strongestPulse, shock);
          spectrumLevels[index] = scale;
          bar.style.transform = `scaleY(${scale.toFixed(3)})`;
          bar.style.opacity = clamp(.72 + scale * .28, .74, 1).toFixed(3);
        });

        pulseEnergy = strongestPulse;
        const centerWave = .5 + .5 * Math.sin(elapsed * 4.15);
        envelope = clamp(.3 + centerWave * .7 + pulseEnergy * .24 + pointer.hold * .12 + Math.abs(pointer.wheel) * .08, .18, 1.24);
      }

      function updateMaMaterial(delta) {
        const travel = ((elapsed * 9.2 + pointer.x * 5 + pointer.wheel * 1.5) % 125 + 125) % 125;
        const sheenPosition = -8 + travel;
        const glassMask = `linear-gradient(106deg, transparent 0%, transparent ${(sheenPosition - 14).toFixed(2)}%, #000 ${(sheenPosition - 5).toFixed(2)}%, #000 ${(sheenPosition + 5).toFixed(2)}%, transparent ${(sheenPosition + 14).toFixed(2)}%, transparent 100%)`;
        const highlightMask = `linear-gradient(106deg, transparent 0%, transparent ${(sheenPosition - 4).toFixed(2)}%, #000 ${(sheenPosition - 1).toFixed(2)}%, #000 ${(sheenPosition + 1).toFixed(2)}%, transparent ${(sheenPosition + 4).toFixed(2)}%, transparent 100%)`;
        const pulse = .2 + envelope * .045 + pointer.hold * .035;

        const tagTravel = ((elapsed * 19.5 + pointer.x * 8 + pointer.wheel * 3) % 74 + 74) % 74;
        const tagPosition = 14 + tagTravel;
        const tagGlassMask = `linear-gradient(100deg, transparent 0%, transparent ${(tagPosition - 19).toFixed(2)}%, #000 ${(tagPosition - 7).toFixed(2)}%, #000 ${(tagPosition + 7).toFixed(2)}%, transparent ${(tagPosition + 19).toFixed(2)}%, transparent 100%)`;
        const tagHighlightMask = `linear-gradient(100deg, transparent 0%, transparent ${(tagPosition - 5).toFixed(2)}%, #000 ${(tagPosition - 1.5).toFixed(2)}%, #000 ${(tagPosition + 1.5).toFixed(2)}%, transparent ${(tagPosition + 5).toFixed(2)}%, transparent 100%)`;

        maGlass.style.webkitMaskImage = glassMask;
        maGlass.style.maskImage = glassMask;
        maHighlight.style.webkitMaskImage = highlightMask;
        maHighlight.style.maskImage = highlightMask;
        maHighlight.style.opacity = pulse.toFixed(3);
        forGlasses.forEach(layer => {
          layer.style.webkitMaskImage = glassMask;
          layer.style.maskImage = glassMask;
        });
        forHighlights.forEach(layer => {
          layer.style.webkitMaskImage = highlightMask;
          layer.style.maskImage = highlightMask;
          layer.style.opacity = (.15 + envelope * .035).toFixed(3);
        });
        tagGlass.style.webkitMaskImage = tagGlassMask;
        tagGlass.style.maskImage = tagGlassMask;
        tagGlass.style.opacity = (.18 + envelope * .11 + pointer.hold * .06).toFixed(3);
        tagHighlight.style.webkitMaskImage = tagHighlightMask;
        tagHighlight.style.maskImage = tagHighlightMask;
        tagHighlight.style.opacity = (.34 + envelope * .2 + pointer.hold * .08).toFixed(3);
        maShell.dataset.sheen = sheenPosition.toFixed(3);
        maShell.dataset.tagSheen = tagPosition.toFixed(3);
      }

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, width < 700 ? 1.35 : 1.65);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        updateSource();
      }

      function updatePointer(event) {
        const canvasRect = canvas.getBoundingClientRect();
        const nextX = (event.clientX ?? canvasRect.left + width * .5) - canvasRect.left;
        const nextY = (event.clientY ?? canvasRect.top + height * .5) - canvasRect.top;
        const dx = nextX - pointer.lastX;
        const dy = nextY - pointer.lastY;
        pointer.targetX = clamp(nextX / width - .5, -.5, .5) * 2;
        pointer.targetY = clamp(nextY / height - .5, -.5, .5) * 2;

        if (pointer.dragging) {
          pointer.orbitX += dy * .0038;
          pointer.orbitY += dx * .0038;
          pointer.velocityX = lerp(pointer.velocityX, dy * .0019, .5);
          pointer.velocityY = lerp(pointer.velocityY, dx * .0019, .5);
          document.body.dataset.interaction = 'drag';
        } else {
          document.body.dataset.interaction = 'hover';
        }

        pointer.lastX = nextX;
        pointer.lastY = nextY;
        pointer.active = true;
      }

      function releasePointer(event) {
        if (pointer.pointerId !== null && event.pointerId !== pointer.pointerId) return;
        pointer.dragging = false;
        pointer.holdTarget = 0;
        pointer.pointerId = null;
        document.body.dataset.interaction = 'inertia';
      }

      function render(now) {
        const delta = Math.min((now - lastFrame) / 1000, .032);
        lastFrame = now;
        elapsed += delta;

        const fastEase = 1 - Math.exp(-delta * 12);
        const softEase = 1 - Math.exp(-delta * 7);
        const sceneEase = 1 - Math.exp(-delta * 5.2);
        const sceneTarget = clamp((document.documentElement.scrollTop || 0) / Math.max(1, height), 0, 1);
        sceneProgress = lerp(sceneProgress, sceneTarget, sceneEase);
        document.documentElement.style.setProperty('--scene-progress', sceneProgress.toFixed(4));
        document.body.dataset.sceneProgress = sceneProgress.toFixed(3);
        pointer.x = lerp(pointer.x, pointer.targetX, fastEase);
        pointer.y = lerp(pointer.y, pointer.targetY, fastEase);
        pointer.hold = lerp(pointer.hold, pointer.holdTarget, softEase);
        pointer.wheel = lerp(pointer.wheel, pointer.wheelTarget, fastEase);
        pointer.wheelTarget *= Math.exp(-delta * 3.2);

        if (!pointer.dragging) {
          pointer.orbitX += pointer.velocityX;
          pointer.orbitY += pointer.velocityY;
          pointer.velocityX *= Math.exp(-delta * 3.8);
          pointer.velocityY *= Math.exp(-delta * 3.8);
        }

        globe.rx += .082 * delta;
        globe.ry += .128 * delta;
        globe.rz += .032 * delta;

        updateSpectrum();
        updateMaMaterial(delta);
        activeModeState = waveformModeState();
        ctx.clearRect(0, 0, width, height);
        renderGlobe();
        requestAnimationFrame(render);
      }

      canvas.addEventListener('pointermove', updatePointer, { passive: true });
      canvas.addEventListener('pointerdown', event => {
        updatePointer(event);
        pointer.dragging = true;
        pointer.holdTarget = 1;
        pointer.pointerId = event.pointerId;
        canvas.setPointerCapture?.(event.pointerId);
        document.body.dataset.interaction = 'hold';
      }, { passive: true });
      canvas.addEventListener('pointerup', releasePointer, { passive: true });
      canvas.addEventListener('pointercancel', releasePointer, { passive: true });
      canvas.addEventListener('pointerleave', () => {
        if (pointer.dragging) return;
        pointer.active = false;
        pointer.targetX = 0;
        pointer.targetY = 0;
        document.body.dataset.interaction = 'idle';
      }, { passive: true });
      canvas.addEventListener('wheel', event => {
        const force = clamp(-event.deltaY / 520, -.58, .58);
        pointer.wheelTarget = clamp(pointer.wheelTarget + force, -.64, .64);
        pointer.active = true;
        document.body.dataset.interaction = 'scroll';
      }, { passive: true });

      window.addEventListener('resize', resize, { passive: true });
      contactLaunch.addEventListener('click', openContact);
      contactClose.addEventListener('click', closeContact);
      contactModal.addEventListener('pointerdown', event => {
        if (event.target === contactModal) closeContact();
      });
      contactForm.addEventListener('submit', submitContact);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && contactModal.classList.contains('open')) closeContact();
      });
      document.fonts?.ready.then(updateSource);
      document.body.dataset.interaction = 'idle';
      resize();
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
